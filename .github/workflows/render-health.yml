name: Render health monitor
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: render-health-monitor
  cancel-in-progress: true
jobs:
  health:
    if: ${{ vars.RENDER_HEALTHCHECK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}
    steps:
      - name: Check the deployed DailyTally service
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.HEALTHCHECK_URL);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.onrender.com') || url.pathname !== '/healthz' || url.search || url.username || url.password) {
            throw new Error('Set RENDER_HEALTHCHECK_URL to the HTTPS Render /healthz address.');
          }
          let ok = false;
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(90000) });
              const body = await response.json();
              if (response.ok && body.status === 'ok' && body.app === 'DailyTally') { ok = true; break; }
            } catch {}
          }
          if (!ok) throw new Error('DailyTally health check failed. Check the Render service logs.');
          console.log('DailyTally health check passed.');
          JS
